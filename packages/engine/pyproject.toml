[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpatch-engine"
version = "0.1.0"
description = "ProofPatch verification engine: AI proposes, deterministic tooling executes, the evidence engine compares."
requires-python = ">=3.10"
dependencies = [
    # On Python 3.15 the latest stable pydantic-core has no cp315 wheel, so the
    # floor is set to the first release that does (see IMPLEMENTATION_NOTES.md).
    "pydantic>=2.14.0b1",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
proofpatch = "proofpatch.cli:main"

[tool.setuptools.packages.find]
include = ["proofpatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
norecursedirs = ["proofpatch", "proofpatch_api", "dist", "node_modules", "build"]
